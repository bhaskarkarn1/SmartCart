[theme]
base = "light"

# Brand colors (match SmartCart blue & red highlights)
primaryColor = "#1f77ff"
secondaryBackgroundColor = "#f9f9ff"

# Subtle light background (matches gradient top layer)
backgroundColor = "#ffffff"

# Text color with slightly softened black for better readability
textColor = "#111111"

# Optional accent tweaks (for hover states, etc.)
font = "sans serif"